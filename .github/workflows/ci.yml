name: HydroThermal Nexus-AI Enterprise CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx joblib flake8

    - name: Code Quality & Syntax Check (Flake8)
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Train ML Model & Save Joblib Artifact
      run: |
        python scripts/train_model.py

    - name: Run Pytest Test Suite
      env:
        PYTHONPATH: .
        NEXUS_API_SECRET: NexusAPI_CI_Test_Key_2026
      run: |
        python -m pytest tests/ -v

  docker-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Container
      run: |
        docker build -t hydrothermal-nexus-ai:latest .

version: '3.9'

services:
  # ── Streamlit Multi-Page Operational Cockpit (Production) ─────────
  frontend-cockpit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hydrothermal_nexus_cockpit_prod
    image: hydrothermal-nexus-ai:2.1.0
    ports:
      - "${PORT_STREAMLIT:-8501}:8501"
    volumes:
      - nexus_prod_data:/app/data
      - ./models:/app/models
    environment:
      - NEXUS_API_SECRET=${NEXUS_API_SECRET:-NexusAPI_Internal_2026}
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_HEADLESS=true
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 256M

  # ── FastAPI Industrial REST Microservice (Production) ──────────────
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hydrothermal_nexus_backend_prod
    command: ["uvicorn", "backend.api:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "2"]
    ports:
      - "${PORT_FASTAPI:-8001}:8001"
    volumes:
      - nexus_prod_data:/app/data
      - ./models:/app/models
    environment:
      - NEXUS_API_SECRET=${NEXUS_API_SECRET:-NexusAPI_Internal_2026}
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 128M

volumes:
  nexus_prod_data:
    driver: local

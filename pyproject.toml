[project]
name = "hydrothermal-nexus-ai"
version = "2.1.0"
description = "Industrial IoT Operational Cockpit, FastAPI REST API, IsolationForest ML Engine & ESG Compliance Exporter"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.35.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "plotly>=5.20.0",
    "pydeck>=0.8.0",
    "requests>=2.31.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --tb=short"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "setup.py", ".venv/*"]

[tool.coverage.report]
show_missing = true
precision = 2

[tool.black]
line-length = 120
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 120

[tool.vercel]
entrypoint = "backend.api:app"

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    upstream streamlit_cockpit {
        server frontend-cockpit:8501;
    }

    upstream fastapi_backend {
        server backend-api:8001;
    }

    server {
        listen 80;
        server_name localhost nexus.hydrothermal.local;

        # Streamlit Cockpit UI & WebSockets
        location / {
            proxy_pass http://streamlit_cockpit;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # FastAPI REST Microservice
        location /api/ {
            proxy_pass http://fastapi_backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # FastAPI OpenAPI / Swagger Docs
        location /docs {
            proxy_pass http://fastapi_backend/docs;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://fastapi_backend/openapi.json;
            proxy_set_header Host $host;
        }
    }
}
